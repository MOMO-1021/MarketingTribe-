name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MarketingTribe APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        working-directory: android
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy APK to public downloads
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/MarketingTribe.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketingTribe-v1.0.0.apk
          path: public/downloads/MarketingTribe.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "MarketingTribe Android App v1.0.0"
          body: "Official Android APK release for MarketingTribe. Download and install directly on your phone."
          files: public/downloads/MarketingTribe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit APK to repository for direct website download
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add compiled MarketingTribe.apk for direct download"
          file_pattern: "public/downloads/MarketingTribe.apk"
